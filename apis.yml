apis:
- aid: lancaster:lancaster-oai2-api
  name: Lancaster EPrints OAI-PMH 2.0 Interface
  description: >-
    The one unambiguous, institution-operated public API Lancaster runs. A single HTTP endpoint
    that dispatches on the OAI-PMH `verb` parameter and returns OAI-PMH 2.0 XML envelopes for the
    Lancaster EPrints institutional repository. Unauthenticated, no registration, full set
    hierarchy, working flow control, and seven metadata formats — didl, mets, oai_bibl, oai_dc,
    rdf, rioxx and uketd_dc. Note the licensing gap: the repository's own Identify response says
    "No metadata policy defined... if in doubt assume that NO rights at all are granted to this
    data", so harvesting is technically open and legally undeclared.
  humanURL: https://eprints.lancs.ac.uk/
  baseURL: https://eprints.lancs.ac.uk/cgi/oai2
  x-operator: institution
  x-operator-evidence: >-
    eprints.lancs.ac.uk is under lancs.ac.uk, which Nominet WHOIS records as "Registered For:
    University of Lancaster" with nameservers ns1/ns2.lancs.ac.uk; www.lancaster.ac.uk itself
    CNAMEs to lancs.ac.uk, so the two are one institution. The Identify response returns
    repositoryName "Lancaster EPrints" and adminEmail library.dit@lancaster.ac.uk. Probed
    2026-08-30: ?verb=Identify 200 text/xml, ?verb=ListMetadataFormats 200, ?verb=ListSets 200,
    ?verb=ListRecords&metadataPrefix=rioxx 200 with a resumptionToken. The software is EPrints
    3.4.5 from the University of Southampton, but the host, the endpoint and the content are
    Lancaster's — an institution-operated deployment, not a vendor tenancy.
