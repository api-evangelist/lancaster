- aid: lancaster:library-discovery
  name: Lancaster Library Discovery and Services (Ex Libris Alma / Primo VE) — tenant
  description: >-
    Lancaster University Library runs on the Ex Libris platform: Primo VE for discovery
    (OneSearch, view identifier 44LAN_INST:LUL_VU1) and Alma for the library services platform
    behind it, whose getUser / getUserCash / getUserLoans / renewUserLoans web services supply
    loans, fines and renewals to the iLancaster app and student portal. The tenancy is real and
    is a genuine institutional fact; the API contract is Ex Libris's and is not saved here. Note
    that Lancaster's own vanity host onesearch.lancaster.ac.uk resolves to a Lancaster IP but
    presents a self-signed certificate (subject CN=localhost) before redirecting, so any pointer
    at that hostname will read as dead to a TLS-verifying client — the working entry point is the
    lancaster-university.uk host below.
  humanURL: https://onesearch.lancaster-university.uk/discovery/search?vid=44LAN_INST:LUL_VU1
