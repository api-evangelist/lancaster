x-coverage:
  state: covered
  reason: covered
  detail: >-
    Nothing blocked this run: more than forty Lancaster hosts and paths were probed successfully
    on 2026-08-30 and the thinness that remains is the institution's, not a fetch failure.
    Lancaster operates two public machine-readable surfaces of its own and both were verified
    live and described here — the EPrints OAI-PMH 2.0 interface (Identify, ListMetadataFormats,
    ListSets and a paged rioxx ListRecords all 200) and its Shibboleth Identity Provider's SAML
    2.0 metadata, confirmed independently through the UK Access Federation MDQ service and
    eduGAIN. There is no developer portal, no API gateway, no API key programme, no OpenAPI
    published by the university, no OpenID Connect discovery document and no llms.txt
    (www.lancaster.ac.uk/llms.txt 404). api.lancaster.ac.uk, api.lancs.ac.uk,
    data.lancaster.ac.uk, data.lancs.ac.uk and opendata.lancaster.ac.uk do not resolve at all, so
    there is no course-catalog API and no open-data portal. Two apparent surfaces are vendor
    contracts on institution vanity hostnames and are recorded as tenant relationships rather
    than credited to Lancaster: Elsevier Pure and Ex Libris Primo VE. The student portal and the
    iLancaster app sit behind CoSign single sign-on at weblogin.lancs.ac.uk and expose nothing
    anonymously. One live defect worth naming: onesearch.lancaster.ac.uk presents a self-signed
    certificate (CN=localhost) before redirecting to the Primo host.
