- aid: lancaster:pure-research-directory
  name: Lancaster Research Directory (Elsevier Pure) — tenant
  description: >-
    Lancaster's research information system and public research directory. The data — outputs,
    people, projects, impact — is Lancaster's; the platform and the contract are Elsevier's.
    research.lancaster-university.uk CNAMEs to lancaster.elsevierpure.com, and Pure's /ws/api web
    service answers on the tenant host but rejects unversioned calls. Pure's generic OpenAPI is
    deliberately NOT saved under this slug: an Elsevier Pure contract attributed to the
    institution is the single largest source of the misattribution the university pipeline exists
    to prevent, and it is exactly how Manchester ended up wearing 36 Pure specs.
  humanURL: https://research.lancaster-university.uk/
