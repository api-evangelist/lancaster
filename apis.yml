aid: lancaster
name: Lancaster University
description: >-
  Lancaster University is a collegiate public research university in Lancaster, United Kingdom,
  a member of the N8 Research Partnership and, at the time of writing, not a Russell Group member.
  It operates no central developer portal, no API gateway, no API key programme and no published
  API programme, and this profile records that plainly. What it does operate, on hosts it owns,
  is a small but genuine set of machine-readable surfaces: the Lancaster EPrints institutional
  repository answers a complete, unauthenticated OAI-PMH 2.0 interface at eprints.lancs.ac.uk
  with seven metadata formats including RIOXX and uketd_dc, and Lancaster runs its own Shibboleth
  Identity Provider at idp.lancs.ac.uk, self-publishing SAML 2.0 metadata and registered with the
  UK Access Federation since 2014 and exported to eduGAIN. Both are institution-operated and both
  are recorded here as such. Two further surfaces look like Lancaster's and are not: the research
  directory at research.lancaster-university.uk CNAMEs to lancaster.elsevierpure.com and the
  OneSearch discovery layer CNAMEs to lancaster.primo.exlibrisgroup.com, so Elsevier Pure and
  Ex Libris Primo VE wrote those contracts, not Lancaster — they are recorded as tenant
  relationships and their specifications are deliberately not saved under this slug. Lancaster's
  most substantial public engineering output is not an API at all: the github.com/lancaster-university
  organisation is where the BBC micro:bit runtime (microbit-dal) and its successor CODAL were
  written, and github.com/lulibrary holds the University Library's own open-source Alma, Pure and
  research-data tooling.
