- aid: lancaster:alma-webhook-handler
  name: Lancaster Library Alma Webhook Handler (open source)
  description: >-
    An AWS serverless application written and maintained by Lancaster University Library that
    listens for Ex Libris Alma webhook events and forwards them to backend SNS topics. It is
