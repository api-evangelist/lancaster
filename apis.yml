- aid: lancaster:identity-federation
  name: Lancaster Shibboleth Identity Provider (SAML 2.0 metadata)
  description: >-
    Lancaster operates its own Shibboleth Identity Provider and self-publishes its SAML 2.0
    EntityDescriptor at the canonical /idp/shibboleth location. The entity has been registered
    with the UK Access Federation since 16 April 2014 and is exported to eduGAIN, so the same
    signed metadata is retrievable from the federation's MDQ service. Identity federation is
    institution-operated by definition — no vendor sits between the university and this document.
    This is the surface class the June 2026 university cohort never catalogued, and for Lancaster
    it is the second of only two genuinely institution-run machine-readable endpoints.
  humanURL: https://www.lancaster.ac.uk/iss/
  baseURL: https://idp.lancs.ac.uk
  x-operator: institution
  x-operator-evidence: >-
    Probed 2026-08-30. GET https://idp.lancs.ac.uk/idp/shibboleth returns 200,
    application/xml;charset=utf-8, 5341 bytes, an <EntityDescriptor> with entityID
    "https://idp.lancs.ac.uk/idp/shibboleth", shibmd:Scope lancaster.ac.uk and a signing
    certificate CN=idp.lancs.ac.uk. The UK Access Federation MDQ service returns the same entity
    signed (200 application/samlmetadata+xml, validUntil 2026-09-20) with
    mdrpi:RegistrationInfo registrationAuthority http://ukfederation.org.uk, registrationInstant
    2014-04-16T16:54:28Z; technical.edugain.org returns it too.
